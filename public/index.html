<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Prof Clash — ETH Zurich</title>
  <meta name="description" content="1v1 Elo battles between the professors of ETH Zurich's mandatory bachelor courses." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
</head>
<body>
  <!-- Sky scene lives behind every view -->
  <div class="sky" aria-hidden="true">
    <div class="sun"><div class="rays"></div></div>
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div>
    <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path class="hill-back" d="M0 190 C 200 110 380 120 560 170 S 920 230 1080 160 S 1340 100 1440 140 V320 H0Z" />
      <path class="hill-mid" d="M0 240 C 180 180 360 200 540 230 S 900 270 1100 215 S 1360 190 1440 210 V320 H0Z" />
      <path class="hill-front" d="M0 280 C 240 250 480 260 720 280 S 1200 300 1440 270 V320 H0Z" />
    </svg>
  </div>

  <header class="topbar" id="topbar">
    <a href="#/" class="brand" aria-label="Prof Clash home">
      <span class="brand-mark">⚔</span><span class="brand-text">PROF CLASH</span>
    </a>
    <nav class="nav">
      <a href="#/battle" data-nav="battle">Battle</a>
      <a href="#/leaderboard" data-nav="leaderboard">Leaderboard</a>
    </nav>
    <div class="me-chip" id="meChip" hidden></div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="sheet-scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Professor details" hidden></section>
  <div class="toast-layer" id="toasts" aria-live="polite"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
